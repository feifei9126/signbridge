<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="stylesheet" href="motion-library.css" />
    <meta charset="UTF-8" />
    <link rel="icon" href="../icons/icon16.png" />
    <title>SignBridge — 手语动画录制器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: monospace;
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        height: 100vh;
      }
      #sidebar {
        width: 320px;
        padding: 12px;
        overflow-y: auto;
        background: #16213e;
        border-right: 1px solid #333;
      }
      #viewer {
        flex: 1;
        position: relative;
        background: #0f0f23;
      }
      #c {
        width: 100%;
        height: 100%;
      }
      h2 {
        color: #4f46e5;
        margin-bottom: 8px;
        font-size: 14px;
      }
      .row {
        display: flex;
        gap: 6px;
        margin: 4px 0;
      }
      label {
        font-size: 11px;
        color: #888;
        display: block;
        margin-top: 4px;
      }
      input,
      select,
      button {
        background: #2a2a4a;
        color: #e0e0e0;
        border: 1px solid #444;
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 11px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #3a3a5a;
      }
      button.rec {
        background: #933;
      }
      button.rec.active {
        background: #393;
        animation: pulse 0.5s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.6;
        }
      }
      #keyframes {
        max-height: 300px;
        overflow-y: auto;
      }
      .kf {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 6px;
        margin: 2px 0;
        background: #2a2a4a;
        border-radius: 3px;
        font-size: 10px;
      }
      .kf.active {
        background: #4f46e5;
      }
      #export-box {
        width: 100%;
        height: 120px;
        font-size: 10px;
        font-family: monospace;
        background: #0a0a1a;
        color: #0f0;
        border: 1px solid #333;
        padding: 4px;
        resize: vertical;
      }
      #preview-timeline {
        display: flex;
        gap: 2px;
        margin: 6px 0;
        flex-wrap: wrap;
      }
      .tick {
        width: 20px;
        height: 20px;
        background: #333;
        border-radius: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
      }
      .tick.active {
        background: #4f46e5;
      }
      .bone-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 2px 0;
      }
      .bone-row .bone-name {
        width: 82px;
        flex: 0 0 82px;
        font-size: 10px;
        color: #888;
        text-align: left;
      }
      .bone-row input[type="range"] {
        flex: 1;
        height: 12px;
      }
      .bone-row span:not(.bone-name) {
        width: 36px;
        font-size: 9px;
        text-align: right;
        color: #ff0;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <h2>🎬 手语动画录制器</h2>
      <section id="motion-library"></section>

      <h2>🎥 录制</h2>
      <div class="row">
        <button id="btn-record" class="rec">⏺ 开始录制</button>
        <button id="btn-add-keyframe">📸 抓关键帧</button>
        <button id="btn-preview">▶ 预览</button>
        <button id="btn-stop-preview">⏹ 停止</button>
      </div>
      <div
        id="rec-status"
        style="font-size: 10px; color: #888; margin-top: 4px"
      >
        空闲
      </div>
      <div id="preview-timeline"></div>

      <h2>📋 关键帧 (<span id="kf-count">0</span>)</h2>
      <div id="keyframes"></div>
      <div class="row" style="margin-top: 6px">
        <button id="btn-delete-keyframe">🗑 删除选中</button>
        <button id="btn-clear-keyframes">🗑 清空全部</button>
        <button id="btn-apply-keyframe">✏ 应用到模型</button>
      </div>

      <h2>🦴 骨骼调试</h2>
      <div id="bone-sliders"></div>
      <button
        id="btn-reset-bones"
        style="margin-top: 4px; width: 100%; background: #933"
      >
        🔄 重置全部骨骼
      </button>

      <h2>📤 导出</h2>
      <textarea
        id="export-box"
        readonly
        placeholder="点击导出按钮生成代码..."
      ></textarea>
      <div class="row" style="margin-top: 4px">
        <button id="btn-export-code">📋 导出为代码</button>
        <button id="btn-export-json">📋 导出为 JSON</button>
        <button id="btn-copy">📋 复制</button>
      </div>
    </div>
    <div id="viewer"><div id="c"></div></div>

    <script type="importmap">
      { "imports": { "three": "../dist/avatar/three.module.js" } }
    </script>
    <script type="module" src="../src/tools/record-mode.js"></script>
  </body>
</html>
