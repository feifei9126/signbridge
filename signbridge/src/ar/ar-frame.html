<!doctype html>
<!-- AR 模式入口页面：在当前页面上创建全屏 AR 视图 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignBridge AR Mode</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
      }

      #ar-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
      }

      #ar-controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 12px 20px;
        border-radius: 24px;
        display: flex;
        gap: 12px;
        z-index: 1000000;
      }

      .ar-btn {
        background: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 16px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .ar-btn:hover {
        background: #f0f0f0;
      }

      .ar-btn.danger {
        background: #ff4444;
        color: #fff;
      }

      .ar-btn.danger:hover {
        background: #cc0000;
      }

      #ar-status {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12px;
        z-index: 1000000;
      }
    </style>
  </head>
  <body>
    <div id="ar-container"></div>
    <div id="ar-status">正在初始化 AR 模式...</div>
    <div id="ar-controls">
      <button class="ar-btn" id="btnTest">测试手语: 你好</button>
      <button class="ar-btn danger" id="btnExit">退出 AR 模式</button>
    </div>

    <script type="module" src="./ar-frame-init.js"></script>
  </body>
</html>
