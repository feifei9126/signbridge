<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignBridge</title>
    <link rel="icon" href="../icons/icon48.png" />
    <link rel="stylesheet" href="asr-settings.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1 data-i18n="workbenchSettings"></h1>
        <p data-i18n="workbenchSettingsLead"></p>
      </div>
      <a class="brand" href="../demo/index.html" data-i18n="workbenchOpen"></a>
    </header>
    <main>
      <section aria-labelledby="display-title">
        <h2 id="display-title" data-i18n="workbenchDisplay"></h2>
        <p data-i18n="workbenchCsl"></p>
        <div class="form-grid">
          <label for="avatarSize"
            ><span data-i18n="avatarSize"></span>
            <div class="range-row">
              <input id="avatarSize" type="range" min="120" max="320" /><output
                id="sizeValue"
                for="avatarSize"
              ></output></div
          ></label>
          <label for="uiLocale"
            ><span data-i18n="language"></span
            ><select id="uiLocale">
              <option value="auto" data-i18n="workbenchSystemLanguage"></option>
              <option value="zh-CN" data-i18n="workbenchLocaleChinese"></option>
              <option value="en" data-i18n="workbenchLocaleEnglish"></option>
              <option
                value="ja"
                data-i18n="workbenchLocaleJapanese"
              ></option></select
          ></label>
        </div>
      </section>
      <section aria-labelledby="asr-title">
        <h2 id="asr-title" data-i18n="asrTitle"></h2>
        <p data-i18n="workbenchAsrLead"></p>
        <div id="localPanel">
          <p data-i18n="asrLocalPrivacy"></p>
          <div class="deployment-row">
            <button
              id="btnDeploy"
              class="primary"
              type="button"
              data-i18n="asrDeployLocal"
            ></button>
            <div class="deployment-state">
              <progress
                id="deployProgress"
                max="100"
                value="0"
                hidden
              ></progress
              ><span id="deployStatus" role="status" aria-live="polite"></span>
            </div>
          </div>
          <p class="hint" data-i18n="asrDeployHint"></p>
        </div>
        <details id="asr-advanced">
          <summary data-i18n="workbenchAdvancedAsr"></summary>
          <h3 data-i18n="asrProvider"></h3>
          <div class="segmented" role="radiogroup" data-i18n-aria="asrProvider">
            <label
              ><input type="radio" name="provider" value="local" /><span
                data-i18n="asrLocal"
              ></span></label
            ><label
              ><input type="radio" name="provider" value="cloud" /><span
                data-i18n="asrCloud"
              ></span
            ></label>
          </div>
          <div id="localModelPanel" class="form-grid">
            <label for="localModel"
              ><span data-i18n="asrModel"></span
              ><select id="localModel">
                <option value="tiny" data-i18n="asrModelTiny"></option>
                <option value="base" data-i18n="asrModelBase"></option>
                <option
                  value="small"
                  data-i18n="asrModelSmall"
                ></option></select
            ></label>
          </div>
          <div id="cloudPanel" hidden>
            <h3 data-i18n="asrCloudSettings"></h3>
            <p data-i18n="asrCloudPrivacy"></p>
            <div class="form-grid">
              <label class="wide" for="cloudEndpoint"
                ><span data-i18n="asrEndpoint"></span
                ><input
                  id="cloudEndpoint"
                  type="url"
                  spellcheck="false" /></label
              ><label for="cloudApiKey"
                ><span data-i18n="asrApiKey"></span
                ><input
                  id="cloudApiKey"
                  type="password"
                  autocomplete="off" /></label
              ><label for="cloudModel"
                ><span data-i18n="asrModel"></span
                ><input id="cloudModel" type="text" spellcheck="false"
              /></label>
            </div>
          </div>
          <div class="form-grid">
            <label for="language"
              ><span data-i18n="asrLanguage"></span
              ><select id="language">
                <option value="zh" data-i18n="workbenchChinese"></option>
                <option value="auto" data-i18n="auto"></option>
                <option
                  value="en"
                  data-i18n="workbenchLocaleEnglish"
                ></option></select
            ></label>
            <label for="chunkSeconds"
              ><span data-i18n="asrChunkSeconds"></span>
              <div class="range-row">
                <input id="chunkSeconds" type="range" min="4" max="15" /><output
                  id="chunkValue"
                  for="chunkSeconds"
                ></output></div
            ></label>
          </div>
        </details>
      </section>
      <footer class="actions">
        <p id="saveStatus" role="status" aria-live="polite"></p>
        <button id="btnTest" type="button" data-i18n="asrTest"></button
        ><button
          id="btnSave"
          class="primary"
          type="button"
          data-i18n="asrSave"
        ></button>
      </footer>
    </main>
    <script type="module" src="asr-settings.js"></script>
  </body>
</html>
