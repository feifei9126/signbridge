<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignBridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app" class="signbridge-popup">
      <header class="sb-header">
        <div class="sb-logo"><span aria-hidden="true">🤟</span> SignBridge</div>
        <span class="sb-language" data-i18n="workbenchCsl"></span>
      </header>
      <section class="sb-status">
        <div class="sb-status-indicator" role="status" aria-live="polite">
          <span class="sb-dot" id="statusDot"></span>
          <span id="statusText" data-i18n="ready"></span>
        </div>
        <button id="btnToggle" class="sb-primary-btn">
          <span id="btnToggleIcon" aria-hidden="true">▶</span>
          <span id="btnToggleText" data-i18n="workbenchStart"></span>
        </button>
      </section>
      <section class="sb-text-input">
        <label for="textInput" data-i18n="workbenchTextPreview"></label>
        <div class="sb-input-row">
          <input
            type="text"
            id="textInput"
            maxlength="500"
            data-i18n-placeholder="inputPlaceholder"
          />
          <button
            id="btnSendText"
            class="sb-primary-btn"
            data-i18n="send"
          ></button>
        </div>
      </section>
      <section class="sb-utilities">
        <div class="sb-audio-row">
          <button
            id="btnAudio"
            class="sb-secondary-btn"
            data-i18n="audioOff"
          ></button>
          <span
            id="audioStatus"
            role="status"
            aria-live="polite"
            data-i18n="audioStopped"
          ></span>
        </div>
        <button
          id="btnDemo"
          class="sb-secondary-btn"
          data-i18n="workbenchOpen"
        ></button>
        <div class="sb-footer-actions">
          <button
            id="btnSettings"
            class="sb-secondary-btn"
            data-i18n="settings"
          ></button>
          <button
            id="btnHelp"
            class="sb-secondary-btn"
            data-i18n="help"
          ></button>
        </div>
      </section>
      <footer class="sb-footer">
        <span id="extension-version"></span><span data-i18n="tagline"></span>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
